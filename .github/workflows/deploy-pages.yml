# Simple GitHub Actions workflow to deploy the webpage/ directory to GitHub Pages
name: Deploy GitHub Page from webpage directory

on:
  push:
    branches: ["main"]
    paths:
      - "webpage/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact (webpage folder)
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'webpage'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
